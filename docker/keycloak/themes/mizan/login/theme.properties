# Mizan login theme: keycloak.v2 (PatternFly 5) with brand tokens from docs/ui-mizan-v2.md §2.
# CSS-only on purpose: no .ftl overrides, so every login page (login, register, verify e-mail,
# reset password, OTP set-up, errors) is themed and Keycloak upgrades stay template-compatible.
# RTL comes from keycloak.v2's template (dir from locale.rtl); fr/ar texts ship with Keycloak.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/mizan.css
