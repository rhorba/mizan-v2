# Trivy exceptions for the Keycloak image ONLY (CI passes --ignorefile for mizan-keycloak:local).
# Each entry expires: after expired_at Trivy reports the finding again and CI turns red.
vulnerabilities:
  - id: CVE-2026-114406
    expired_at: 2026-11-30
    statement: >-
      ca-certificates in quay.io/keycloak/keycloak:26.8.1 (ubi9-micro). The fixed package
      (2026.2.92_v9.0.319-90.3.el9_8) is only in RHEL subscription repos, not in UBI, and no newer
      Keycloak image exists (checked 2026-10-23). Keycloak runs locally and in CI only until Epic 7.
      Accepted by the owner on 2026-10-23; recheck on every Keycloak release and before preprod.
