# Serves the Angular build (Story 7.2). Runs as nginx-unprivileged (uid 101, port 8080).
# TLS, HSTS and routing of /api, /auth, /otlp are Traefik's job; this only serves the SPA.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Set once here: no add_header inside locations, or nginx would drop these there.
    # 'unsafe-inline' styles: Angular injects component styles as <style> tags.
    # No inline scripts: the preprod build turns off critical-CSS inlining (its onload= handler).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles (outputHashing: all) never change under the same name.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
