# Tests: a throwaway PostgreSQL 18 per JVM via the Testcontainers JDBC URL (same image as compose).
spring:
  datasource:
    url: jdbc:tc:postgresql:18.6-alpine:///mizan?TC_DAEMON=true
    username: test
    password: test
  flyway:
    create-schemas: true
mizan:
  upload:
    uploads-per-minute: 1000 # tests upload often; UploadDefencesTests sets its own limit
