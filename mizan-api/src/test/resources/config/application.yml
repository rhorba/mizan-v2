# Tests: a throwaway PostgreSQL 18 per JVM via the Testcontainers JDBC URL (same image as compose).
spring:
  datasource:
    url: jdbc:tc:postgresql:18.6-alpine:///mizan?TC_DAEMON=true
    username: test
    password: test
  flyway:
    create-schemas: true
mizan:
  quota: # tests upload often as the same user; QuotaTests sets the real caps
    daily-per-user: 1000
    daily-global: 1000
  upload:
    uploads-per-minute: 1000 # tests upload often; UploadDefencesTests sets its own limit
  events:
    resend-stale: false # OutboxTests drive resubmission explicitly
spring.kafka.producer.properties:
  # Fail fast when OutboxTests pauses the broker (defaults wait 60-120 s).
  max.block.ms: 3000
  request.timeout.ms: 2000
  delivery.timeout.ms: 5000
