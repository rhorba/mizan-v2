spring:
  application:
    name: mizan-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true # framework errors (missing parameter, wrong method…) as RFC 9457 too
  servlet:
    multipart:
      max-file-size: 10MB # = mizan.upload.max-bytes; larger files get 413 too-large
      max-request-size: 11MB
      file-size-threshold: 0 # container temp file, deleted after the request; never kept
  # Overridden by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (.env.example).
  datasource:
    url: jdbc:postgresql://localhost:5435/mizan
    username: mizan_app
    password: ${MIZAN_DB_PASSWORD:}
    hikari:
      # Plain JDBC (Modulith's event_publication) resolves to schema "mizan". Setting
      # spring.modulith.events.jdbc.schema instead makes Modulith run CREATE SCHEMA, which
      # mizan_app may not do.
      schema: mizan
  flyway:
    schemas: mizan
    default-schema: mizan
    create-schemas: false # mizan_app owns schema "mizan" (db/init) and cannot create schemas
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks the mapping
    properties:
      hibernate.default_schema: mizan
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mizan-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false # each listener sets its own value type
        allow.auto.create.topics: false # topics come from NewTopic beans (3 partitions)
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Consumers map JSON to their own records; no Java class names on the wire.
        spring.json.add.type.headers: false
  modulith:
    events:
      kafka:
        enable-json: false # its message converter always adds __TypeId__; the serializer above does JSON
      # Events carry contract text: drop completed publications so a deleted contract leaves no copy.
      completion-mode: delete
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

mizan:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mizan}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/mizan/protocol/openid-connect/certs}
    audience: mizan-api
    cors-allowed-origins: ${MIZAN_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  quota:
    daily-per-user: ${MIZAN_QUOTA_DAILY_PER_USER:3}
  upload:
    uploads-per-minute: ${MIZAN_UPLOADS_PER_MINUTE:10}
  budget:
    # Per-user daily model spend; prices default to Claude Opus 5.5 ($ per million tokens).
    daily-usd: ${MIZAN_AI_DAILY_BUDGET_USD:0.50}
    input-usd-per-mtok: ${MIZAN_AI_INPUT_USD_PER_MTOK:4}
    output-usd-per-mtok: ${MIZAN_AI_OUTPUT_USD_PER_MTOK:20}
  antivirus:
    host: ${MIZAN_CLAMAV_HOST:} # empty = scanning disabled (warning at start-up)
