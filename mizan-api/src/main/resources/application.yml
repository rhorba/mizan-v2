spring:
  application:
    name: mizan-api
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

mizan:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mizan}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/mizan/protocol/openid-connect/certs}
    audience: mizan-api
    cors-allowed-origins: ${MIZAN_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  quota:
    daily-per-user: ${MIZAN_QUOTA_DAILY_PER_USER:3}
