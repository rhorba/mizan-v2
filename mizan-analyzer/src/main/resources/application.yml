spring:
  application:
    name: mizan-analyzer
  main:
    # Worker with no web server: stay up even before any @KafkaListener exists.
    keep-alive: true
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
