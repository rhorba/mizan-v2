# Story 6.2: SonarCloud analysis, run by the `sonar` job in .github/workflows/ci.yml after both test
# jobs (Automatic Analysis is off: it cannot read our coverage). Token: GitHub secret SONAR_TOKEN.
sonar.organization=rhorba
sonar.projectKey=rhorba_mizan-v2
sonar.projectName=mizan-v2

sonar.sources=mizan-api/src/main,mizan-analyzer/src/main,mizan-web/src
sonar.tests=mizan-api/src/test,mizan-analyzer/src/test,mizan-web/src,mizan-web/e2e
# mizan-web/src holds both: specs are tests, everything else is source.
sonar.exclusions=mizan-web/src/**/*.spec.ts
sonar.test.inclusions=mizan-api/src/test/**,mizan-analyzer/src/test/**,mizan-web/src/**/*.spec.ts,mizan-web/e2e/**

sonar.java.source=25
sonar.java.binaries=mizan-api/target/classes,mizan-analyzer/target/classes

# Same reports and scope as the 80 % gates (JaCoCo aggregate; Angular coverageInclude src/app).
sonar.coverage.jacoco.xmlReportPaths=coverage-report/target/site/jacoco-aggregate/jacoco.xml
sonar.javascript.lcov.reportPaths=mizan-web/coverage/mizan-web/lcov.info
sonar.coverage.exclusions=mizan-web/src/main.ts,mizan-web/src/environments/**

# java:S5693 flags upload limits above 8 MB. 10 MB is the product limit (Story 2.1, = mizan.upload.max-bytes;
# 11 MB request for the form fields); uploads are authenticated, rate-limited (10/min/user), virus-scanned
# and PDF-validated before any parsing. Scoped to this one file; owner-accepted 2026-10-28.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S5693
sonar.issue.ignore.multicriteria.e1.resourceKey=mizan-api/src/main/resources/application.yml
