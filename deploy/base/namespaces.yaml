# Story 7.2 / docs/devops: apps in mizan, stateful services in platform, telemetry in observability.
# Every container has a read-only root file system. Our own images meet the "restricted" Pod
# Security Standard; ClamAV and otel-lgtm start as root, so their namespaces enforce "baseline".
apiVersion: v1
kind: Namespace
metadata:
  name: mizan
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
