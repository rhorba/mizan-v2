# Traefik (bundled with k3s) middlewares; IngressRoutes may only use those in their own namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: mizan
spec:
  headers:
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: mizan
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform
spec:
  headers:
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: observability
spec:
  headers:
    stsSeconds: 31536000
# --- R-OTLP: browser spans reach only /v1/traces, small bodies, rate-limited ---
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otlp-strip-prefix
  namespace: observability
spec:
  stripPrefix:
    prefixes: ["/otlp"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otlp-body-limit
  namespace: observability
spec:
  buffering:
    maxRequestBodyBytes: 524288 # 512 KB; a browser batch is a few KB
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otlp-rate-limit
  namespace: observability
spec:
  # Behind k3s ServiceLB the client address may be the node's, making this a global cap:
  # still ample for demo traffic (one batch every few seconds per open tab).
  rateLimit:
    average: 10
    period: 1s
    burst: 30
