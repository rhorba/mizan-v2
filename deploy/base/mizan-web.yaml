# mizan-web: the Angular build served by unprivileged nginx (docker/web.Dockerfile).
apiVersion: v1
kind: Service
metadata:
  name: mizan-web
  namespace: mizan
  labels:
    app: mizan-web
spec:
  selector:
    app: mizan-web
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizan-web
  namespace: mizan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mizan-web
  template:
    metadata:
      labels:
        app: mizan-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mizan-web
          image: mizan-web
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # nginx pid and temp files
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
