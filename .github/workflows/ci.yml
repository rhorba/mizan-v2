# Story 1.3 — runs on every push and on pull requests to main.
# Actions are pinned by commit SHA (tag in the comment); scanner images by digest.
name: ci

on:
  push:
    # env/preprod is written by the promote job below; it only re-tags images already gated.
    branches-ignore: ["env/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TERRAFORM_IMAGE: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77
  KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.8.1@sha256:899fcd3bc898160e62bcaf82932b0cb29ba38d16272353db2e7acbba82129429
  # kubeconform's image is not anonymously pullable; the release binary is checked against this sum.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # Traefik and cert-manager CRD schemas, pinned to a commit of datreeio/CRDs-catalog.
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Java — Enforcer, Spotless, Checkstyle
        run: ./mvnw -B -ntp validate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mizan-web/package-lock.json
      - name: Web — ESLint, Prettier
        working-directory: mizan-web
        run: |
          npm ci
          npm run lint
          npm run format:check
      - name: Terraform — fmt, validate, plan tests with a mocked provider (Story 7.1)
        # No OCI credentials in CI: tests/plan.tftest.hcl asserts the plan against mock_provider.
        run: |
          tf() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra/terraform:/tf" -w "/tf/$1" "$TERRAFORM_IMAGE" "${@:2}"; }
          tf . fmt -check -recursive
          for stack in bootstrap main; do
            tf "$stack" init -backend=false -input=false
            tf "$stack" validate
          done
          tf main test
      - name: Kubernetes — kustomize build, kubeconform (Story 7.2)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$KUSTOMIZE_IMAGE" \
            build --load-restrictor LoadRestrictionsNone deploy/overlays/preprod > "$RUNNER_TEMP/preprod.yaml"
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default -schema-location "$CRD_SCHEMAS" "$RUNNER_TEMP/preprod.yaml"

  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit + architecture tests, JaCoCo gate 80 %
        # Formatting and Checkstyle already run in the lint job.
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true -Dcheckstyle.skip=true
      - name: Coverage summary
        if: always()
        run: |
          csv=coverage-report/target/site/jacoco-aggregate/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 {m+=$8; c+=$9} END {
            printf "### Backend coverage\n\n| Lines covered | Total | Line coverage |\n|---|---|---|\n| %d | %d | %.1f %% |\n", c, m+c, (m+c ? 100*c/(m+c) : 100)
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-backend
          path: coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Story 6.2: SonarCloud's Java analysis reads the compiled classes.
        with:
          name: backend-classes
          path: |
            mizan-api/target/classes/
            mizan-analyzer/target/classes/
          retention-days: 1

  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mizan-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mizan-web/package-lock.json
      - run: npm ci
      - name: Unit tests, coverage gate 80 %
        run: npm test
      - name: Coverage summary
        if: always()
        run: |
          f=coverage/mizan-web/coverage-summary.json
          [ -f "$f" ] || exit 0
          # shellcheck disable=SC2016 # ${...} below is JavaScript, not shell
          node -e '
            const t = require(process.argv[1]).total;
            const row = k => `| ${k} | ${t[k].covered}/${t[k].total} | ${t[k].pct} % |`;
            console.log(["### Frontend coverage", "", "| Metric | Covered | % |", "|---|---|---|",
              ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
          ' "$PWD/$f" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-frontend
          path: mizan-web/coverage/
          if-no-files-found: ignore

  sonar:
    # Story 6.2: SonarCloud with both coverage reports; a failed quality gate fails this job.
    # main and pull requests only: a feature-branch push would analyse the same code twice.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SONAR_TOKEN available?
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No SONAR_TOKEN (Dependabot and fork PRs get no secrets): SonarCloud skipped"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # blame and new-code detection
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: backend-classes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-backend
          path: coverage-report/target/site/jacoco-aggregate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-frontend
          path: mizan-web/coverage
      - name: lcov paths relative to the repository root
        if: steps.token.outputs.present == 'true'
        run: sed -i 's#^SF:#SF:mizan-web/#' mizan-web/coverage/mizan-web/lcov.info
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --verbose
      - name: Semgrep
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --config p/default --config p/java --config p/typescript --config p/dockerfile
          --sarif-output=semgrep.sarif
      # pom.xml is skipped: resolving BOMs from Maven Central gets rate-limited (HTTP 429).
      # Java dependencies are scanned as resolved jars in the stack job's image scan.
      - name: Trivy — npm, secrets, IaC (SARIF, all severities)
        if: always()
        run: >-
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE"
          fs --quiet --scanners vuln,secret,misconfig --skip-dirs /repo/skills --skip-files '**/pom.xml'
          --format sarif --output /repo/trivy.sarif /repo
      - name: Trivy — fail on HIGH/CRITICAL
        run: >-
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE"
          fs --quiet --scanners vuln,secret,misconfig --skip-dirs /repo/skills --skip-files '**/pom.xml'
          --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Trivy results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local-only env from .env.example
        run: |
          cp .env.example .env
          grep -E '^[A-Z_]+=' .env.example >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images (GitHub Actions layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: mizan-api,mizan-analyzer,keycloak
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Stack healthy within 120 s (Story 1.2)
        run: scripts/stack-check.sh --profile apps
      - name: Logs on failure
        if: failure()
        run: docker compose --profile '*' logs --no-color --tail 200
      - name: Trivy — images (fixable HIGH/CRITICAL)
        run: |
          for image in mizan-api:local mizan-analyzer:local mizan-keycloak:local; do
            echo "::group::$image"
            ignore=()
            # Time-boxed, documented exceptions for the Keycloak base image only.
            if [ "$image" = mizan-keycloak:local ]; then
              ignore=(--ignorefile /repo/docker/keycloak/trivyignore.yaml)
            fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGE" \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "${ignore[@]}" "$image"
            echo "::endgroup::"
          done
      - name: Stop stack
        if: always()
        run: docker compose --profile '*' down -v

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local-only env from .env.example
        run: |
          cp .env.example .env
          grep -E '^[A-Z_]+=' .env.example >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images (GitHub Actions layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: mizan-api,mizan-analyzer,keycloak
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: ClamAV signatures cache key (weekly)
        id: week
        run: echo "key=clamav-db-$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clamav-db
          key: ${{ steps.week.outputs.key }}
          restore-keys: clamav-db-
      - name: Stack with apps, Mailpit and ClamAV
        run: |
          mkdir -p "$RUNNER_TEMP/clamav-db" && chmod 777 "$RUNNER_TEMP/clamav-db"
          export CLAMAV_DB="$RUNNER_TEMP/clamav-db" MIZAN_CLAMAV_HOST=clamav
          sed -i 's/^MIZAN_CLAMAV_HOST=$/MIZAN_CLAMAV_HOST=clamav/' .env
          docker compose --profile apps --profile mail --profile av up -d --wait --wait-timeout 600
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mizan-web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: mizan-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright (sign-up … logout; upload, ClamAV, history, delete)
        working-directory: mizan-web
        env:
          E2E_AV: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-videos-and-traces
          path: |
            mizan-web/test-results/
            mizan-web/playwright-report/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --profile '*' logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose --profile '*' down -v

  # Story 7.2: images for preprod, main only and after every gate. Multi-arch because the
  # preprod node is an arm64 A1; build stages run natively, only small RUN steps use QEMU.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test-backend, test-frontend, security, stack, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: mizan-api
            context: .
            file: docker/spring-app.Dockerfile
            build-args: MODULE=mizan-api
          - image: mizan-analyzer
            context: .
            file: docker/spring-app.Dockerfile
            build-args: MODULE=mizan-analyzer
          - image: mizan-web
            context: mizan-web
            file: docker/web.Dockerfile
            build-args: ""
          - image: mizan-keycloak
            context: docker
            file: docker/keycloak.Dockerfile
            build-args: ""
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.image }}
          cache-to: type=gha,scope=publish-${{ matrix.image }},mode=max
      # A failed scan stops promote, so a vulnerable image is pushed but never deployed.
      - name: Trivy — both platforms (fixable HIGH/CRITICAL)
        run: |
          ignore=()
          if [ "${{ matrix.image }}" = mizan-keycloak ]; then
            ignore=(--ignorefile /repo/docker/keycloak/trivyignore.yaml)
          fi
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker pull -q --platform "$platform" "$IMAGE"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGE" \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "${ignore[@]}" "$IMAGE"
            echo "::endgroup::"
          done

  # Option A (decisions 2026-10-29): env/preprod = main@<sha> + one commit setting every image
  # tag to <sha>; Argo CD tracks env/preprod. Pushes made with GITHUB_TOKEN start no workflow.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: env/preprod = main + image tags
        env:
          SHA: ${{ github.sha }}
          OVERLAY: deploy/overlays/preprod/kustomization.yaml
        run: |
          git switch -C env/preprod
          sed -i -E "s/^( +newTag: ).*/\1\"${SHA}\"/" "$OVERLAY"
          test "$(grep -c "newTag: \"${SHA}\"" "$OVERLAY")" -eq 4
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "deploy(preprod): images ${SHA:0:7}"
          git push --force origin env/preprod
          echo "env/preprod → $(git rev-parse --short HEAD) (images ${SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
