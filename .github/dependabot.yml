# cooldown: let a new release age a week before proposing it (supply-chain safety).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      spring:
        patterns: ["org.springframework*"]
    # The logback appender must stay on the release built on the OpenTelemetry version Spring Boot
    # manages (ADR-8); move it by hand with Spring Boot, not on its own.
    ignore:
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"

  - package-ecosystem: npm
    directory: /mizan-web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      # One OpenTelemetry JS release line: stable 2.x and experimental 0.x packages move together.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
    # OpenTelemetry JS 3.0 (stable 3.x, experimental 0.300+) is an upgrade story of its own,
    # done when every package we use has shipped it; stay on the 2.x line until then.
    ignore:
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-web"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation-xml-http-request"
        versions: [">=0.300.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: [/docker]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
