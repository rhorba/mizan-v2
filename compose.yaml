# Local stack for Mizan. See README "Run locally".
#   docker compose up -d --wait                    infrastructure only (apps run from the IDE)
#   docker compose --profile apps up -d --wait     infrastructure + mizan-api + mizan-analyzer
#   docker compose --profile mail up -d --wait     + Mailpit (Keycloak verify-email / reset)
name: mizan

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      MIZAN_DB_PASSWORD: ${MIZAN_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mizan"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  keycloak:
    image: mizan-keycloak:local
    build:
      context: docker
      dockerfile: keycloak.Dockerfile
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/mizan
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Local only: plain HTTP. Preprod terminates TLS at the ingress (docs/devops).
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; talk HTTP over bash /dev/tcp. /health/ready turns UP before the
      # realm import (bootstrap) finishes, so wait for the mizan realm's discovery document instead.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/mizan/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    # Story 6.1: Mizan dashboard + alert rules as code, beside the image's own provisioning.
    volumes:
      - ./docker/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mizan.yaml:ro
      - ./docker/grafana/dashboards:/otel-lgtm/mizan/dashboards:ro
      - ./docker/grafana/alerting/mizan-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/mizan-alerts.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [mail]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Virus scanning (Sprint 2). First start downloads ~300 MB of signatures, so it is opt-in:
  #   docker compose --profile apps --profile av up -d --wait   (and MIZAN_CLAMAV_HOST=clamav in .env)
  clamav:
    image: clamav/clamav:1.5.4
    profiles: [av]
    volumes:
      # CI points CLAMAV_DB at a cached host directory so signatures are not re-downloaded.
      - ${CLAMAV_DB:-clamav-db}:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  mizan-api:
    image: mizan-api:local
    build:
      context: .
      dockerfile: docker/spring-app.Dockerfile
      args:
        MODULE: mizan-api
    profiles: [apps]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mizan
      SPRING_DATASOURCE_USERNAME: mizan_app
      SPRING_DATASOURCE_PASSWORD: ${MIZAN_DB_PASSWORD:?set in .env}
      # Tokens are issued to the browser via localhost; keys are fetched inside the network.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/mizan
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mizan/protocol/openid-connect/certs
      MIZAN_CORS_ALLOWED_ORIGINS: ${MIZAN_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      MIZAN_QUOTA_DAILY_PER_USER: ${MIZAN_QUOTA_DAILY_PER_USER:-5}
      MIZAN_QUOTA_DAILY_GLOBAL: ${MIZAN_QUOTA_DAILY_GLOBAL:-20}
      MIZAN_UPLOADS_PER_MINUTE: ${MIZAN_UPLOADS_PER_MINUTE:-10}
      MIZAN_CLAMAV_HOST: ${MIZAN_CLAMAV_HOST:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MIZAN_AI_DAILY_BUDGET_USD: ${MIZAN_AI_DAILY_BUDGET_USD:-0.50}
      MIZAN_AI_INPUT_USD_PER_MTOK: ${MIZAN_AI_INPUT_USD_PER_MTOK:-4}
      MIZAN_AI_OUTPUT_USD_PER_MTOK: ${MIZAN_AI_OUTPUT_USD_PER_MTOK:-20}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
        required: false # only when the av profile is on

  mizan-analyzer:
    image: mizan-analyzer:local
    build:
      context: .
      dockerfile: docker/spring-app.Dockerfile
      args:
        MODULE: mizan-analyzer
    profiles: [apps]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MIZAN_AI_MODEL: ${MIZAN_AI_MODEL:-claude-opus-5-5}
      MIZAN_AI_MAX_TOKENS: ${MIZAN_AI_MAX_TOKENS:-16000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  clamav-db:
